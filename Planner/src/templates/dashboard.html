<!DOCTYPE html>
<html>
    <head>
        <!--Defines the char set used-->
        <meta charset="UTF-8">
        <!--Defines with JavaScript to use and its path-->
        <script src="/scripts/dash.js" defer></script>
        <!--Defines where to find a style sheet and witch to use-->
        <link rel="stylesheet" href="/style/test.css">
        <title>Dashboard</title>
    <head>
    <body>
        <h1 class="title">Dashboard</h1>
        <!-- Link in Button style instead of actual button -->
        <a href="/calendar" class="btn">Zum Kalender</a>
        <!--ToDo task dislplay-->
        <div class="todo-section">
            <h2>TODOs</h2>
            
            <!-- Eingabeformular -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="todo-input" placeholder="Neue Aufgabe..." />
                <input type="date" id="todo-duedate" />
                <select id="todo-category">
                    <option value="Uni">Uni</option>
                    <option value="Familie">Familie</option>
                    <option value="Freunde">Freunde</option>
                </select>
                <button onclick="addTodo()">Hinzufügen</button>
            </div>

            <!-- Liste -->
            <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
        </div>
    </body>
</html>
