<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Planner Kalender</title>
    <!-- FullCalendar CSS & JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <!--Defines with JavaScript to use and its path-->
    <script src="/scripts/cale.js" defer></script>
    <!--Defines where to find a style sheet and witch to use-->
    <link rel="stylesheet" href="/style/test.css">
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #calendar { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>

    <a href="/" class="btn">Dashboard</a>
    
    <!--platzhakter für den button-->
    <p><br></p> 
    
    <div id="calendar"></div>
    
    <!--ToDo task dislplay-->
    <div class="todo-section">
        <h2>TODOs</h2>
                
        <!-- Hauptformular für To-Dos -->
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="todo-input" placeholder="Neue Aufgabe...">
            <input type="date" id="todo-duedate">
            <input type="time" id="todo-duetime">
            <select id="todo-category" onchange="handleCategoryChange(this.value)"></select>
            <button onclick="addTodo()">Hinzufügen</button>
        </div>

        <!-- Erstellungsbereich für neue Kategorien (klappt darunter auf) -->
        <div id="new-category-container" style="display: none; gap: 8px; margin-top: 8px; align-items: center;">
            <input type="text" id="new-cat-name" placeholder="Kategoriename...">
            <input type="color" id="new-cat-color" value="#3498db" style="width: 40px; height: 38px; border: none; cursor: pointer;">
            <button type="button" onclick="addCategory()">Kategorie speichern</button>
        </div>

        <!-- Liste -->
         <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
    </div>
    
</body>
</html>
